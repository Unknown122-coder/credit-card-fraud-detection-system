name: Continuous Integration & Model Delivery

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code formatting check (black)
        run: |
          black --check src/ app/ tests/

      - name: Run linting (ruff)
        run: |
          ruff check src/ app/ tests/

      - name: Run mypy
        run: mypy src/ app/ --ignore-missing-imports --follow-imports=silent

      - name: Run unit test suite
        run: |
          pytest tests/unit/ -v --cov=src --cov=app --cov-report=xml --cov-report=term-missing

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-stage Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: fraud-detection:ci-test
