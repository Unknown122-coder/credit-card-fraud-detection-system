[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:fastapi]
command=uvicorn app.api.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/fastapi.err.log
stdout_logfile=/tmp/fastapi.out.log
priority=10

[program:streamlit]
command=streamlit run app/ui/streamlit_app.py --server.port 7860 --server.address 0.0.0.0 --server.headless true
directory=/app
autostart=true
autorestart=true
environment=API_URL="http://127.0.0.1:8000"
stderr_logfile=/tmp/streamlit.err.log
stdout_logfile=/tmp/streamlit.out.log
priority=20
